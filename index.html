-en="Built, not just imagined." data-pt="Projetos reais, não apenas ideias."></h2><div class="row g-3 mt-3"><div class="col-md-4"><article class="panel p-4 h-100"><p class="accent">01 / WEB</p><h3>Visto Certo</h3><p class="muted" data-en="Self-owned visa advisory website: service presentation and customer inquiry journey." data-pt="Site próprio de assessoria de vistos: apresentação de serviços e jornada de contato."></p><a data-en="Visit website ↗" data-pt="Visitar site ↗" href="https://gsalviatti.github.io/VistoCerto/" rel="noopener noreferrer" target="_blank"></a></article></div><div class="col-md-4"><article class="panel p-4 h-100"><p class="accent">02 / DATA</p><h3 data-en="Professional portfolio" data-pt="Portfólio profissional"></h3><p class="muted" data-en="Personal analytics portfolio and business intelligence project showcase." data-pt="Portfólio pessoal de analytics e projetos de business intelligence."></p><a data-en="Visit portfolio ↗" data-pt="Visitar portfólio ↗" href="https://gsalviatti.github.io/" rel="noopener noreferrer" target="_blank"></a></article></div><div class="col-md-4"><article class="panel p-4 h-100"><p class="accent">03 / CREATOR</p><h3>Following Gabi</h3><p class="muted" data-en="Founder-owned travel creator portfolio with photo and video showcases, partnership offers and affiliate links." data-pt="Portfólio próprio de viagens com fotos, vídeos, propostas de parceria e links de afiliados."></p><a data-en="Explore live website ↗" data-pt="Ver site publicado ↗" href="https://gsalviatti.github.io/bygsalviatti/" rel="noopener noreferrer" target="_blank">Explore live website ↗</a></article></div></div><p class="muted mt-3" data-en="These are founder-owned projects, not third-party client endorsements." data-pt="São projetos próprios, não depoimentos de clientes externos."></p></div></section><section class="section border-top border-secondary"><div class="container"><p class="accent">03 / PROCESS</p><h2 class="display-5 fw-bold" data-en="Cle class="form-label" data-en="Project goals and desired timeline" data-pt="Objetivos e prazo desejado" for="details"></label><textarea class="form-control" id="details" maxlength="1500" name="details" required="" rows="4"></textarea></div><p class="small muted" data-en="We use your details to respond to your inquiry. Formspree processes and stores submissions. For privacy requests, contact contactgsdigitalstudio@gmail.com. Do not include sensitive information." data-pt="Usamos seus dados para responder à solicitação. O Formspree processa e armazena os envios. Para solicitações de privacidade, escreva para contactgsdigitalstudio@gmail.com. Não inclua dados sensíveis."></p><div aria-hidden="true" class="visually-hidden"><label>Leave empty<input autocomplete="off" name="_gotcha" tabindex="-1"/></label></div><input id="service-label" name="service" type="hidden"/><div class="form-check mb-3"><input class="form-check-input" id="consent" name="contact_permission" required="" type="checkbox" value="yes"/><label class="form-check-label small" data-en="I agree to be contacted about this inquiry." data-pt="Concordo em receber contato sobre esta solicitação." for="consent">I agree to be contacted about this inquiry.</label></div><button class="btn btn-primary w-100" data-en="Send project inquiry" data-pt="Enviar solicitação" disabled="disabled" type="submit"></button><p class="small mt-3" id="status" role="status"></p><button id="native-submit" class="btn btn-outline-light w-100 d-none" type="button" data-en="Try standard Formspree submission" data-pt="Tentar envio padrão pelo Formspree">Try standard Formspree submission</button></form><p class="small mt-3"><a href="mailto:contactgsdigitalstudio@gmail.com">contactgsdigitalstudio@gmail.com</a></p></div></div></div></section></main><footer class="container py-4 border-top border-secondary"><p class="muted small">© 2026 GS Digital Studio · <span data-en="Brazil · Serving clients worldwide" data-pt="Brasil · Atendimento internacional"></span></p></footer><script>const packages=[['Landing page','Landing page','$350','R$990','One page, responsive layout, contact CTA, basic SEO','Uma página, layout responsivo, CTA de contato, SEO básico'],['Professional portfolio','Portfólio profissional','$500','R$1.490','Career or creator showcase, project sections, contact','Apresentação profissional ou criativa, projetos e contato'],['Business website','Site empresarial','$850','R$2.490','Up to five sections or pages, service showcase, contact','Até cinco seções ou páginas, serviços e contato'],['Bilingual website','Site bilíngue','$1,200','R$3.490','Two language versions, localized content and navigation','Dois idiomas, conteúdo e navegação localizados'],['Analytics & BI','Analytics e BI','Custom quote','Sob consulta','KPI design, dashboards, reporting and data analysis','KPIs, dashboards, relatórios e análise de dados'],['AI & automation','IA e automação','Custom quote','Sob consulta','Workflow assessment, integrations and automation','Avaliação de processos, integrações e automação']];const steps=[['Discover','Descoberta','Goals, audience and scope','Objetivos, público e escopo'],['Design','Design','Structure and visual direction','Estrutura e direção visual'],['Build','Desenvolvimento','Implementation and review','Implementação e revisão'],['Launch','Lançamento','Testing, handover and agreed support','Testes, entrega e suporte acordado']];let lang='en';function setLang(l){lang=l;document.documentElement.lang=l==='pt'?'pt-BR':'en';document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset[l]);document.title=l==='pt'?'GS Digital Studio | Sites, Analytics e Automação':'GS Digital Studio | Websites, Analytics & Automation';document.querySelector('meta[name=description]').content=l==='pt'?'Sites bilíngues, landing pages, business intelligence e automação para empresas.':'Bilingual websites, landing pages, business intelligence and automation for growing businesses.';for(const k of ['en','pt']){document.getElementById(k).classList.toggle('active',k===l);document.getElementById(k).setAttribute('aria-pressed',String(k===l))}const pt=l==='pt',old=document.getElementById('service').value;document.getElementById('packages').innerHTML=packages.map((p,i)=>`<div class="col-md-6 col-lg-4"><article class="panel p-4 h-100 d-flex flex-column"><h3 class="h4">${p[pt?1:0]}</h3><p class="h2 accent">${p[pt?3:2]}</p><p class="muted flex-grow-1">${p[pt?5:4]}</p><a class="btn btn-outline-light" href="#contact" data-package="${i}">${pt?'Solicitar orçamento':'Request quote'}</a></article></div>`).join('');document.getElementById('service').innerHTML=packages.map((p,i)=>`<option value="${i}">${p[pt?1:0]}</option>`).join('');if(old!=='')document.getElementById('service').value=old;document.getElementById('process').innerHTML=steps.map((p,i)=>`<div class="col-md-3"><div class="panel p-3 h-100"><p class="accent">0${i+1}</p><h3 class="h5">${p[pt?1:0]}</h3><p class="muted">${p[pt?3:2]}</p></div></div>`).join('');try{localStorage.setItem('gs-studio-lang',l)}catch(e){}}document.getElementById('en').onclick=()=>setLang('en');document.getElementById('pt').onclick=()=>setLang('pt');document.getElementById('packages').addEventListener('click',e=>{const a=e.target.closest('[data-package]');if(a)document.getElementById('service').value=a.dataset.package});const form=document.getElementById('lead');const endpoint=form.dataset.endpoint;const configured=/^https:\/\/formspree\.io\/f\/[a-zA-Z0-9]+$/.test(endpoint);const submit=form.querySelector('button[type=submit]');submit.disabled=!configured;if(configured){form.action=endpoint;document.getElementById('status').removeAttribute('data-en');document.getElementById('status').removeAttribute('data-pt');}form.addEventListener('submit',async e=>{e.preventDefault();if(!configured)return;const status=document.getElementById('status');submit.disabled=true;document.getElementById('service-label').value=packages[Number(document.getElementById('service').value)][0];status.textContent=lang==='pt'?'Enviando…':'Sending…';try{const response=await fetch(endpoint,{method:'POST',body:new FormData(form),headers:{Accept:'application/json'}});if(!response.ok){const payload=await response.json().catch(()=>null);throw Error('HTTP '+response.status+(payload?.errors?.length?': '+payload.errors.map(x=>x.message).join('; '):''));}form.reset();status.textContent=lang==='pt'?'Solicitação recebida. Obrigado!':'Inquiry received. Thank you!';}catch(err){status.textContent=(lang==='pt'?'Falha no envio: ':'Submission failed: ')+err.message+(location.protocol==='file:'?' — Local file / arquivo local. Try the standard submission button below.':'');document.getElementById('native-submit').classList.remove('d-none');}finally{submit.disabled=false;}});document.getElementById('native-submit').onclick=()=>{if(!form.reportValidity())return;document.getElementById('service-label').value=packages[Number(document.getElementById('service').value)][0];HTMLFormElement.prototype.submit.call(form);};let initial=new URLSearchParams(location.search).get('lang');try{initial=initial||localStorage.getItem('gs-studio-lang')}catch(e){}setLang(initial==='pt'?'pt':'en');</script></body></html>
