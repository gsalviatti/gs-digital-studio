uired=""></select></div><div class="mb-3"><label class="form-label" data-en="Budget and currency (optional)" data-pt="Orçamento e moeda (opcional)" for="budget"></label><input class="form-control" id="budget" maxlength="100" name="budget"/></div><div class="mb-3"><label class="form-label" data-en="Project goals and desired timeline" data-pt="Objetivos e prazo desejado" for="details"></label><textarea class="form-control" id="details" maxlength="1500" name="details" required="" rows="4"></textarea></div><p class="small muted" data-en="We use your details to respond to your inquiry. Formspree processes and stores submissions. For privacy requests, contact contactgsdigitalstudio@gmail.com. Do not include sensitive information." data-pt="Usamos seus dados para responder à solicitação. O Formspree processa e armazena os envios. Para solicitações de privacidade, escreva para contactgsdigitalstudio@gmail.com. Não inclua dados sensíveis."></p><div aria-hidden="true" class="visually-hidden"><label>Leave empty<input autocomplete="off" name="_gotcha" tabindex="-1"/></label></div><input id="service-label" name="service" type="hidden"/><div class="form-check mb-3"><input class="form-check-input" id="consent" name="contact_permission" required="" type="checkbox" value="yes"/><label class="form-check-label small" data-en="I agree to be contacted about this inquiry." data-pt="Concordo em receber contato sobre esta solicitação." for="consent">I agree to be contacted about this inquiry.</label></div><button class="btn btn-primary w-100" data-en="Send project inquiry" data-pt="Enviar solicitação" disabled="disabled" type="submit"></button><p class="small mt-3" id="status" role="status"></p><button id="native-submit" class="btn btn-outline-light w-100 d-none" type="button" data-en="Try standard Formspree submission" data-pt="Tentar envio padrão pelo Formspree">Try standard Formspree submission</button></form><p class="small mt-3"><a href="mailto:contactgsdigitalstudio@gmail.com">contactgsdigitalstudio@gmail.com</a></p></div></div></div></section></main><footer class="container py-4 border-top border-secondary"><p class="muted small">© 2026 GS Digital Studio · <span data-en="Brazil · Serving clients worldwide" data-pt="Brasil · Atendimento internacional"></span></p></footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script>document.querySelectorAll("#studio-nav a").forEach(a=>a.addEventListener("click",()=>{const n=document.getElementById("studio-nav");if(n.classList.contains("show")&&window.bootstrap)bootstrap.Collapse.getOrCreateInstance(n,{toggle:false}).hide()}));const packages=[['Landing page','Landing page','$350','R$990','One page, responsive layout, contact CTA, basic SEO','Uma página, layout responsivo, CTA de contato, SEO básico'],['Professional portfolio','Portfólio profissional','$500','R$1.490','Career or creator showcase, project sections, contact','Apresentação profissional ou criativa, projetos e contato'],['Business website','Site empresarial','$850','R$2.490','Up to five sections or pages, service showcase, contact','Até cinco seções ou páginas, serviços e contato'],['Bilingual website','Site bilíngue','$1,200','R$3.490','Two language versions, localized content and navigation','Dois idiomas, conteúdo e navegação localizados'],['Analytics & BI','Analytics e BI','Custom quote','Sob consulta','KPI design, dashboards, reporting and data analysis','KPIs, dashboards, relatórios e análise de dados'],['AI & automation','IA e automação','Custom quote','Sob consulta','Workflow assessment, integrations and automation','Avaliação de processos, integrações e automação']];const packageDetails=[["Responsive one-page site","Contact CTA and basic SEO","Launch handover","Site responsivo de uma página","CTA de contato e SEO básico","Entrega orientada"],["Project and experience sections","Responsive layout and contact","Basic SEO and handover","Seções de projetos e experiência","Layout respo
